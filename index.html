<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fontes: Plus Jakarta Sans (textos) e Outfit (títulos e valores). Ficam guardadas para uso offline. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap">
<script>
// Tema: 'auto' (segue o celular), 'light' ou 'dark'. Aplicado antes de desenhar a tela.
function themePref(){return localStorage.getItem('fin-tema')||'auto'}
function applyTheme(){
  const p=themePref(),dark=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0d0d0d':'#f4f4f1';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themePref()==='auto')applyTheme()});
</script>
<style>
/* Cores: neutros + 8 cores de categoria (ordem fixa, testada para daltonismo) + cores de status */
:root{color-scheme:light;--bg:#f4f4f1;--card:#fcfcfb;--tx:#0b0b0b;--tx2:#52514e;--mu:#898781;--ln:#e6e5df;--bd:rgba(11,11,11,.08);
--acc:#2a78d6;--pos:#006300;--crit:#d03b3b;--warnTx:#8a5a00;--shadow:0 1px 2px rgba(0,0,0,.04);
--s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#eda100;--s4:#e87ba4;--s5:#008300;--s6:#6250d6;--s7:#e34948}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--tx:#f0efec;--tx2:#c3c2b7;--mu:#898781;--ln:#2c2c2a;--bd:rgba(255,255,255,.08);
--acc:#3987e5;--pos:#0ca30c;--crit:#e66767;--warnTx:#fab219;--shadow:none;
--s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#c98500;--s4:#d55181;--s5:#0ca30c;--s6:#9085e9;--s7:#e66767}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ft:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--fd:Outfit,"Plus Jakarta Sans",system-ui,sans-serif;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1)}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--ft);-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
/* Títulos e valores em Outfit */
.big,.mlabel,.ttl,.sh-head h2,.welcome h2,#gate h1,.trio b,.ctop b,.trow b,.budget b,.stats b,.amt input,.amt span,.stepper b,.sr b,.xsum b{font-family:var(--fd)}
.ctop,.tt{letter-spacing:-.005em}
.trow b,.ctop b,.sr b{font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.mu{color:var(--tx2)}.sm{font-size:13px}
.pos{color:var(--pos)}.iv{color:var(--acc)}

/* Topo */
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:2px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;max-width:560px;margin:0 auto}
.mlabel{flex:1;display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:18px;line-height:1.2;min-height:40px;justify-content:center}
.mlabel small{font-size:11px;font-weight:600;color:var(--acc)}
.ttl{flex:1;font-weight:700;font-size:24px;letter-spacing:-.01em;padding:8px 6px}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--tx2)}
.ib:hover{background:var(--ln)}
.ib svg{width:22px;height:22px}
.sp{width:40px;flex:none}

main{max-width:560px;margin:0 auto;padding:4px 14px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow);border-radius:18px;padding:16px;margin:0 0 12px}
.card h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.lnk{font-size:13px;color:var(--acc);font-weight:600;text-transform:none;letter-spacing:0}

/* Resumo */
.hero .lbl{color:var(--tx2);font-size:13px;font-weight:500}
.big{font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums;margin:0 0 14px;white-space:nowrap}
.big.neg{color:var(--crit)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio>*{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.trio span{font-size:12px;color:var(--tx2)}
.trio b{font-size:clamp(12px,3.4vw,14px);letter-spacing:-.01em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:12px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 10%,transparent)}
.budget .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.budget .bl{font-weight:600;font-size:14px}.budget .bs{font-size:12px;color:var(--tx2)}
.budget b{font-size:20px;font-weight:800;white-space:nowrap}
.budget svg{width:18px;height:18px;color:var(--mu)}
.rate{margin-top:14px}.rtxt{font-size:13px;color:var(--tx2);margin-bottom:6px}
.bar{display:block;height:6px;border-radius:6px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;min-width:2px}

/* Linhas */
.crow,.trow,.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0}
.crow+.crow,.trow+.trow,.mi+.mi,.crow+.subd+.crow{border-top:1px solid var(--ln)}
.cic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c,var(--mu)) 18%,transparent)}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ctop{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ctop b{white-space:nowrap}
.csub{font-size:12px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap}
.st{font-weight:600}.st.warn{color:var(--warnTx)}.st.crit{color:var(--crit)}
.tmain,.mt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts,.mt small{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow b{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.okb{width:38px;height:38px;flex:none;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;color:var(--pos)}
.okb svg{width:18px;height:18px}
.okb:hover{background:color-mix(in srgb,var(--pos) 12%,transparent)}
.mi svg{width:18px;height:18px;color:var(--mu)}
.mi.dng{color:var(--crit)}
.day{font-size:12px;font-weight:600;color:var(--mu);margin:16px 4px 2px}
.day:first-child{margin-top:4px}
.subd{animation:fadeUp .3s var(--ease);background:var(--bg);border-radius:12px;padding:6px 12px 10px;margin:0 0 10px 50px}
.sr{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.sr+.sr{border-top:1px solid var(--ln)}
.sr b{font-weight:600}
.insight{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px;color:var(--tx2)}
.insight b{color:var(--tx)}
.empty{text-align:center;color:var(--tx2);padding:26px 10px;font-size:14px}
.empty .e{font-size:34px;margin-bottom:6px}
.welcome h2{margin:0 0 4px;font-size:20px}
.welcome ol{padding-left:20px;margin:8px 0 14px;color:var(--tx2);font-size:14px}
.welcome li{margin-bottom:6px}
.notice{border-color:color-mix(in srgb,var(--acc) 40%,transparent)}

/* Gráficos */
.dwrap{display:flex;justify-content:center;margin:4px 0 8px}
.donut{width:176px;height:176px}
.dseg{cursor:pointer;transition:opacity .15s}.dseg:hover{opacity:.8}
.dl{font-size:11px;fill:var(--tx2);text-anchor:middle}
.dv{font-family:var(--fd);font-size:18px;font-weight:700;fill:var(--tx);text-anchor:middle}
.lg{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin:2px 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ax{font-size:10px;fill:var(--mu);text-anchor:middle}.ax.on{fill:var(--tx);font-weight:700}
.axl{font-size:10px;fill:var(--mu)}
.grid{stroke:var(--ln);stroke-width:1}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:color-mix(in srgb,var(--tx) 5%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stats div{background:var(--bg);border-radius:12px;padding:10px}
.stats span{display:block;font-size:12px;color:var(--tx2)}.stats b{font-size:15px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tx);color:var(--card);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:9px;opacity:0;transition:opacity .1s;max-width:220px}
#tip.on{opacity:1}

/* Extrato */
.fbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding:2px 0}
.fbar::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--tx2)}
.fchip.on{background:var(--tx);color:var(--card);border-color:var(--tx)}
.fchip.x{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);border-color:transparent}
.fbar .ib{width:36px;height:36px;margin-left:auto;background:var(--card);border:1px solid var(--bd)}
.fbar .ib svg{width:18px;height:18px}
.xsum{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);padding:10px 4px 0}
.xsum b{color:var(--tx)}

/* Navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 9px;font-size:11px;color:var(--mu);font-weight:500}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:9}
.fab svg{width:26px;height:26px}

/* Folha (janela de baixo) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex;animation:fadeIn .25s ease}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:up .42s var(--spring)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.ov.closing{animation:fadeIn .22s ease reverse forwards}
.ov.closing .sheet{animation:down .24s cubic-bezier(.5,0,.75,0) forwards}
.sheet .swap{animation:fadeIn .22s ease}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.sm button{padding:7px 6px;font-size:13px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ln);padding:4px 2px;margin-bottom:6px}
.amt:focus-within{border-color:var(--acc)}
.amt span{font-size:20px;color:var(--tx2);font-weight:600}
.amt input{flex:1;border:0;outline:0;background:none;font-size:34px;font-weight:700;min-width:0;padding:0}
.amt.err{border-color:var(--crit)}
.lbl2{font-size:12px;font-weight:600;color:var(--tx2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ln);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 15%,transparent);font-weight:600}
.chips.sm .chip{padding:5px 11px;font-size:13px}
.fld{width:100%;border:1.5px solid var(--ln);background:var(--bg);border-radius:12px;padding:11px 12px;outline:0}
.fld:focus{border-color:var(--acc)}
textarea.fld{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gic{display:grid;grid-template-columns:72px 1fr;gap:8px}
.fld.ic{text-align:center;font-size:20px;padding:8px}
.hint{font-size:12px;color:var(--tx2);margin:6px 2px 0}
.chk{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--acc);flex:none;margin:0}
.btn{padding:12px 14px;border-radius:12px;font-weight:600;background:var(--bg);border:1px solid var(--ln);text-align:center}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.dng{color:var(--crit)}
.btn.full{width:100%;display:block;margin-top:10px}
.acts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.acts .btn{flex:1}
.ask{width:100%;font-size:14px;color:var(--tx2);margin-bottom:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--ln);font-size:18px;font-weight:700}
.stepper b{min-width:34px;text-align:center}
.ytab{background:var(--bg);border-radius:12px;padding:4px 12px}
.ytab .yh,.ytab .yr{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:6px;align-items:center;width:100%;text-align:right;padding:8px 0;font-variant-numeric:tabular-nums}
.ytab .yh{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.ytab .yr{font-size:13px;border-top:1px solid var(--ln)}
.ytab .yh>:first-child,.ytab .yr>:first-child{text-align:left;font-weight:600}
.ytab .yr b{font-family:var(--fd);font-weight:600}
.stats span+b+span{font-size:11px}
.tips h4{margin:14px 0 4px;font-size:15px}.tips p{margin:0;color:var(--tx2);font-size:14px}
.foot{text-align:center;font-size:12px;color:var(--mu);margin:16px 20px}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.92);background:var(--tx);color:var(--card);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .4s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:70;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast button{color:var(--acc);font-weight:700;filter:brightness(1.3)}
/* ================= Movimento =================
   .anim só é colocado ao trocar de aba/mês (não a cada clique), para não ficar cansativo. */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-28px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes donutIn{from{opacity:0;transform:rotate(-100deg) scale(.82)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes rowOut{to{opacity:0;transform:translateX(40px)}}
@keyframes checkIn{from{transform:scale(.4) rotate(-20deg)}}
#view.anim>*,#xlist.anim>*{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
#view.anim[data-dir=l]>*{animation-name:slideL}
#view.anim[data-dir=r]>*{animation-name:slideR}
#top.anim .mlabel{animation:fadeIn .35s var(--ease)}
#view.anim .bar i{transform-origin:left;animation:growX .8s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + .15s)}
#view.anim .donut{animation:donutIn .9s var(--ease) both}
#view.anim .hbar{transform-box:fill-box;transform-origin:bottom;animation:growY .7s var(--ease) both;animation-delay:calc(var(--b,0)*45ms + .2s)}
/* toques */
button{transition:transform .14s var(--ease),background-color .2s,color .2s,border-color .2s,box-shadow .2s,opacity .2s}
.btn:active,.chip:active,.fchip:active,.okb:active,.ib:active,.trio>button:active{transform:scale(.95)}
.crow:active,.trow:active,.mi:active,.budget:active,.pmain:active{transform:scale(.985)}
.card{transition:background-color .35s,border-color .35s,transform .2s}
.fab{transition:transform .25s var(--spring),box-shadow .25s}
.fab:hover{transform:rotate(90deg)}
.fab:active{transform:scale(.88) rotate(90deg)}
.fab.in{animation:pop .45s var(--spring) both}
/* navegação: "pílula" atrás do ícone ativo */
nav.tabs .nic{display:grid;place-items:center;width:54px;height:30px;border-radius:15px;transition:background-color .3s var(--ease),transform .3s var(--spring)}
nav.tabs button.on .nic{background:color-mix(in srgb,var(--acc) 16%,transparent)}
nav.tabs button.pop .nic{animation:pop .4s var(--spring)}
nav.tabs button:active .nic{transform:scale(.9)}
/* linha confirmada some com estilo */
.trow.done{animation:rowOut .35s var(--ease) .15s forwards}
.trow.done .okb{background:var(--pos);border-color:var(--pos);color:#fff}
.trow.done .okb svg{animation:checkIn .3s var(--spring)}
/* resumo do Início */
.budget{transition:transform .14s var(--ease),background-color .25s}
.budget:hover{background:color-mix(in srgb,var(--acc) 15%,transparent)}
@media (hover:hover){.crow:hover .cic,.trow:hover .cic,.mi:hover .cic{transform:scale(1.08)}}
.cic{transition:transform .25s var(--spring)}
/* respeita quem prefere menos movimento */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Imagem "Welcome" (pixel art preta em fundo branco): some o fundo e inverte no modo escuro */
.wimg{display:block;width:100%;max-width:300px;height:auto;mix-blend-mode:multiply;image-rendering:pixelated}
:root[data-theme=dark] .wimg{filter:invert(1);mix-blend-mode:screen}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .45s var(--ease),transform .45s var(--ease)}
#gate[hidden]{display:none}
#gate.leave{opacity:0;transform:scale(1.06);pointer-events:none}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate .box>*{animation:fadeUp .6s var(--ease) both}
#gate .box>:nth-child(2){animation-delay:.15s}#gate .box>:nth-child(3){animation-delay:.22s}#gate .box>:nth-child(4){animation-delay:.3s}#gate .box>:nth-child(5){animation-delay:.38s}
#gate .wimg{margin:0 auto;animation:pop .7s var(--spring) both,bob 3.2s ease-in-out .8s infinite}
.welcome .wimg{animation:pop .6s var(--spring) both}
#gate h1{font-size:21px;margin:26px 0 4px}
#gate .fld{text-align:center;font-size:18px;margin:18px 0 0}

<script>
/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round(n*100)/100;
const clamp=p=>Math.max(0,Math.min(100,p||0));
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const ymOf=d=>d.slice(0,7);
function addM(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)}
function daysIn(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function dateIn(ym,day){return ym+'-'+pad(Math.min(Math.max(1,day|0),daysIn(ym)))}
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mLabel=ym=>MESES[+ym.slice(5)-1]+' '+ym.slice(0,4);
const mShort=ym=>MESES[+ym.slice(5)-1].slice(0,3).toLowerCase();
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const BRL0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRLc=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1});
let hide=localStorage.getItem('fin-ocultar')==='1';
const money=n=>hide?'R$ ••••':BRL.format(n);
const moneyS=n=>hide?'••••':(Math.abs(n)>=10000?BRLc.format(n):BRL0.format(n));
const fmtIn=n=>n?String(r2(n).toFixed(2)).replace('.',','):'';
function parseMoney(s){s=String(s||'').replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 home:ic('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
 list:ic('<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),
 pie:ic('<path d="M21 13A9 9 0 1 1 11 3v10z"/><path d="M14.5 2.6A9 9 0 0 1 21.4 9.5H14.5z"/>'),
 trend:ic('<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>'),
 wallet:ic('<path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4m0 4v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/>'),
 more:ic('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'),
 left:ic('<path d="M15 18l-6-6 6-6"/>'),right:ic('<path d="M9 18l6-6-6-6"/>'),
 eye:ic('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
 eyeOff:ic('<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
 plus:ic('<path d="M12 5v14M5 12h14"/>'),x:ic('<path d="M6 6l12 12M18 6 6 18"/>'),
 search:ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
 check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),chev:ic('<path d="M9 18l6-6-6-6"/>')
};

/* ================= Dados ================= */
const KEY='financas-v1';
const PAY={pix:'Pix',debito:'Débito',credito:'Crédito',dinheiro:'Dinheiro'};
const KINDS=[['Reserva','🐷'],['Renda fixa','🏦'],['Tesouro','🏛️'],['Ações/FIIs','📊'],['Cripto','💠'],['Previdência','☂️'],['Outros','💰']];
const kindIcon=k=>(KINDS.find(x=>x[0]===k)||KINDS[6])[1];
function blank(){return{v:1,tx:[],rec:[],
 cats:{
  out:[
   {id:'essencial',name:'Essencial',icon:'🏠',slot:0,limit:0,ess:true,subs:['Moradia','Contas da casa','Mercado','Saúde','Transporte','Outros']},
   {id:'familia',name:'Família',icon:'👨‍👩‍👧',slot:1,limit:0,subs:['Ajuda em casa','Filhos','Presentes','Outros']},
   {id:'diversao',name:'Diversão',icon:'🎉',slot:2,limit:0,subs:['Rolês','Delivery','Assinaturas','Viagem','Compras','Outros']},
   {id:'veiculo',name:'Moto/Carro',icon:'🏍️',slot:3,limit:0,veh:true,subs:['Combustível','Manutenção','Seguro','IPVA/Licenciamento','Parcela','Estacionamento','Outros']}
  ],
  in:[
   {id:'salario',name:'Salário',icon:'💼',subs:[]},
   {id:'extra',name:'Trabalhos por fora',icon:'🛠️',subs:[]},
   {id:'rend',name:'Renda de investimentos',icon:'📈',subs:[],rend:true},
   {id:'outros_in',name:'Outras entradas',icon:'➕',subs:[]}
  ]},
 invs:[{id:'reserva',name:'Reserva de emergência',kind:'Reserva',goal:0,auto:true}],
 accs:defAccs(),
 cards:[],
 set:{resMonths:6,lastBackup:'',saveGoal:0,lastAcc:'',lastCard:''}}}
// Contas/carteiras: saldo = valor inicial (informado em "since") + movimentações a partir dessa data
function defAccs(){const t=todayStr();return[{id:'conta',name:'Conta principal',icon:'🏦',initial:0,since:t,ok:false},{id:'dinheiro',name:'Dinheiro vivo',icon:'💵',initial:0,since:t,ok:false}]}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tx)){const b=blank();const r=Object.assign(b,d);r.set=Object.assign(blank().set,d.set);if(!Array.isArray(d.accs))r.accs=defAccs();if(!Array.isArray(d.cards))r.cards=[];return r}}catch(e){}return blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
let data=load();

let cur=ymOf(todayStr()), tab='home', openCat=null;
let xf={type:'all',cat:null,q:'',search:false,allM:true};

const catList=type=>type==='in'?data.cats.in:data.cats.out;
const cat=(type,id)=>catList(type).find(c=>c.id===id);
const invById=id=>data.invs.find(i=>i.id===id);
const catColor=(c,type)=>type==='in'||!c?'var(--acc)':`var(--s${c.slot})`;

/* ================= Cálculos ================= */
function summary(ym){
 const s={in:0,out:0,inv:0,aport:0,resg:0,rend:0};
 for(const t of data.tx){
  if(!t.date.startsWith(ym))continue;
  if(t.type==='in'){s.in+=t.amount;const c=cat('in',t.cat);if(c&&c.rend){s.rend+=t.amount;if(t.inv&&t.reinv)s.inv+=t.amount}}
  else if(t.type==='out')s.out+=t.amount;
  else if(t.type==='inv'){s.inv+=t.amount;s.aport+=t.amount}
  else if(t.type==='res'){s.inv-=t.amount;s.resg+=t.amount}
 }
 // "Sobrou" = o que ficou na conta: entrou − gastou − foi para investimentos.
 // Rendimento reinvestido conta como entrada E como investido, então não altera o "Sobrou".
 s.left=r2(s.in-s.out-s.inv);s.rate=s.in>0?s.inv/s.in:0;
 return s;
}
function outByCat(ym){
 const r={};
 for(const t of data.tx){if(t.type!=='out'||!t.date.startsWith(ym))continue;
  const k=cat('out',t.cat)?t.cat:'_none';const o=r[k]||(r[k]={total:0,subs:{}});o.total+=t.amount;o.subs[t.sub||'']=(o.subs[t.sub||'']||0)+t.amount}
 return r;
}
// Data de referência dos saldos: hoje (mês atual) ou fim do mês escolhido
function balDate(){const t=todayStr();return cur===ymOf(t)?t:cur+'-31'}
function balLabel(){const n=ymOf(todayStr());return cur===n?'hoje':cur<n?`no fim de ${mShort(cur)}`:`previsto para o fim de ${mShort(cur)}`}
function accBal(a,upTo){
 let b=a.initial||0;
 for(const t of data.tx){if(t.date<a.since||t.date>upTo)continue;
  if(t.type==='tr'){if(t.acc===a.id)b-=t.amount;if(t.acc2===a.id)b+=t.amount;continue}
  if(t.acc!==a.id)continue;
  if(t.type==='in'){if(!(t.reinv&&t.inv))b+=t.amount}
  else if(t.type==='out'||t.type==='inv'||t.type==='pf')b-=t.amount;
  else if(t.type==='res')b+=t.amount}
 return r2(b);
}
const accById=id=>data.accs.find(a=>a.id===id);

/* Cartão de crédito
   Fatura = identificada pelo mês em que FECHA (YYYY-MM).
   Compra no dia do fechamento ou depois vai para a fatura do mês seguinte. */
const cardById=id=>data.cards.find(c=>c.id===id);
const fmtD=d=>d.slice(8)+'/'+d.slice(5,7);
function fatOf(c,date){const ym=ymOf(date);return +date.slice(8)>=c.close?addM(ym,1):ym}
const fatClose=(c,f)=>dateIn(f,c.close);
const fatDue=(c,f)=>c.due>c.close?dateIn(f,c.due):dateIn(addM(f,1),c.due);
const fatItems=(c,f)=>data.tx.filter(t=>t.type==='out'&&t.card===c.id&&fatOf(c,t.date)===f);
const fatTotal=(c,f)=>r2(sum(fatItems(c,f),t=>t.amount));
const fatPaid=(c,f)=>r2(sum(data.tx.filter(t=>t.type==='pf'&&t.card===c.id&&t.fat===f),t=>t.amount));
const fatOpen=(c,f)=>r2(fatTotal(c,f)-fatPaid(c,f));
// dívida do cartão até uma data (compras feitas − pagamentos feitos)
function cardDebt(c,upTo){return r2(sum(data.tx.filter(t=>t.card===c.id&&t.date<=upTo),t=>t.type==='out'?t.amount:t.type==='pf'?-t.amount:0))}
// limite usado inclui parcelas futuras
function cardUsed(c){return r2(sum(data.tx.filter(t=>t.card===c.id),t=>t.type==='out'?t.amount:t.type==='pf'?-t.amount:0))}
const cardFuture=c=>r2(sum(data.tx.filter(t=>t.type==='out'&&t.card===c.id&&t.date>todayStr()),t=>t.amount));
function fatStatus(c,f){
 const t=todayStr(),open=fatOpen(c,f),cl=fatClose(c,f),du=fatDue(c,f);
 if(t<cl)return{k:'open',txt:`Aberta · fecha ${fmtD(cl)} · vence ${fmtD(du)}`};
 if(open<=0)return{k:'paid',txt:fatTotal(c,f)?'Paga ✓':'Sem compras'};
 if(t>du)return{k:'late',txt:`⚠ Venceu em ${fmtD(du)}`};
 return{k:'closed',txt:`Fechada · pagar até ${fmtD(du)}`};
}
// a fatura que mais importa agora: a mais antiga fechada e não paga; senão a aberta atual
function mainFat(c){
 const t=todayStr(),now=fatOf(c,t);
 for(let i=6;i>=1;i--){const f=addM(now,-i);if(fatOpen(c,f)>0)return f}
 return now;
}
function invBal(id,upTo){
 let b=0;
 for(const t of data.tx){if(t.inv!==id||t.date>upTo)continue;
  if(t.type==='inv')b+=t.amount;else if(t.type==='res')b-=t.amount;else if(t.type==='in'&&t.reinv)b+=t.amount}
 return r2(b);
}
function essAvg(ym){
 const ids=data.cats.out.filter(c=>c.ess).map(c=>c.id);let tot=0,n=0;
 for(let i=0;i<3;i++){const m=addM(ym,-i);const v=sum(data.tx.filter(t=>t.type==='out'&&ids.includes(t.cat)&&t.date.startsWith(m)),t=>t.amount);if(v>0){tot+=v;n++}}
 return n?tot/n:0;
}
const invGoal=i=>i.auto?r2(essAvg(cur)*(data.set.resMonths||6)):(i.goal||0);
function pendings(ym){return data.rec.filter(r=>r.start<=ym&&!(r.skip||[]).includes(ym)&&!data.tx.some(t=>t.rid===r.id&&t.date.startsWith(ym))).sort((a,b)=>a.day-b.day)}
function vehStats(ym){
 const vc=data.cats.out.filter(c=>c.veh).map(c=>c.id);if(!vc.length)return null;
 const fuel=data.tx.filter(t=>t.type==='out'&&vc.includes(t.cat)&&t.km>0).sort((a,b)=>a.km-b.km);
 let dist=0,lt=0,ltDist=0;
 for(let i=1;i<fuel.length;i++){const t=fuel[i];if(!t.date.startsWith(ym))continue;const d=t.km-fuel[i-1].km;if(d<=0||d>5000)continue;dist+=d;if(t.lt>0){lt+=t.lt;ltDist+=d}}
 const spent=sum(data.tx.filter(t=>t.type==='out'&&vc.includes(t.cat)&&t.date.startsWith(ym)),t=>t.amount);
 return{dist,kml:lt?ltDist/lt:0,cpk:dist?spent/dist:0,spent,hasKm:fuel.length>0};
}
function insight(ym){
 const bc=outByCat(ym),prevs=[1,2,3].map(i=>outByCat(addM(ym,-i)));let best=null;
 for(const c of data.cats.out){const v=bc[c.id]?.total||0;const ps=prevs.map(p=>p[c.id]?.total||0).filter(x=>x>0);if(!v||!ps.length)continue;
  const avg=sum(ps,x=>x)/ps.length,d=v-avg;if(d>=50&&d/avg>=.2&&(!best||d>best.d))best={c,d,p:d/avg}}
 if(best)return`📈 <b>${esc(best.c.name)}</b> está ${Math.round(best.p*100)}% acima da sua média dos últimos meses.`;
 const s=summary(ym),p=summary(addM(ym,-1));
 if(ym<ymOf(todayStr())&&p.out>0&&s.out>0&&s.out<p.out*.9)return`👏 Você gastou <b>${Math.round((1-s.out/p.out)*100)}% menos</b> que no mês anterior.`;
 return'';
}

// Quanto posso gastar por dia (só no mês atual):
// (entradas recebidas + previstas) − gastos feitos − contas fixas a pagar − o que vai guardar, ÷ dias que faltam
function dailyBudget(){
 const now=todayStr(),ym=ymOf(now);if(cur!==ym)return null;
 const s=summary(ym),pend=pendings(ym);
 const reinv=sum(data.tx.filter(t=>t.type==='in'&&t.reinv&&t.inv&&t.date.startsWith(ym)),t=>t.amount);
 const inRec=sum(pend.filter(r=>r.type==='in'&&!(r.reinv&&r.inv)),r=>r.amount);
 const outRec=sum(pend.filter(r=>r.type==='out'),r=>r.amount);
 const invRec=sum(pend.filter(r=>r.type==='inv'),r=>r.amount)-sum(pend.filter(r=>r.type==='res'),r=>r.amount);
 const received=s.in-reinv,invested=s.inv-reinv,goal=data.set.saveGoal||0;
 const income=received+inRec,saveAmt=Math.max(goal,invested+invRec);
 const free=r2(income-s.out-outRec-saveAmt),days=daysIn(ym)-(+now.slice(8))+1;
 return{received,inRec,spent:s.out,outRec,saveAmt,goal,invested:invested+invRec,income,free,days,perDay:free/days};
}

/* ================= Exibição de lançamentos ================= */
function txView(t){
 if(t.type==='pf'){const c=cardById(t.card),a=accById(t.acc);return{icon:'💳',col:'var(--mu)',title:t.desc||'Pagamento de fatura',sub:(c?c.name:'Cartão')+' · fatura de '+mShort(t.fat)+(a?' · da '+a.name:'')}}
 if(t.type==='tr'){const a=accById(t.acc),b=accById(t.acc2);return{icon:'⇄',col:'var(--mu)',title:t.desc||'Transferência',sub:(a?a.name:'?')+' → '+(b?b.name:'?')}}
 if(t.type==='inv'||t.type==='res'){const i=invById(t.inv);
  return{icon:i?kindIcon(i.kind):'💰',col:'var(--acc)',title:t.desc||(t.type==='inv'?'Aplicação':'Resgate'),sub:(t.type==='inv'?'Aplicação':'Resgate')+' · '+(i?i.name:'Investimento')}}
 const c=cat(t.type,t.cat);let sub=c?c.name:'Sem categoria';
 if(t.sub&&t.desc)sub+=' · '+t.sub;if(t.parc)sub+=' · '+t.parc;if(t.card&&cardById(t.card))sub+=' · 💳 '+cardById(t.card).name;else if(t.pay)sub+=' · '+PAY[t.pay];
 if(t.km)sub+=' · '+t.km.toLocaleString('pt-BR')+' km';
 return{icon:c?c.icon:'•',col:catColor(c,t.type),title:t.desc||t.sub||(c?c.name:'—'),sub};
}
function amtHtml(t){
 if(t.type==='in')return`<b class="pos">+${money(t.amount)}</b>`;
 if(t.type==='out')return`<b>−${money(t.amount)}</b>`;
 if(t.type==='tr'||t.type==='pf')return`<b class="mu">${money(t.amount)}</b>`;
 return`<b class="iv">${t.type==='res'?'↩ ':''}${money(t.amount)}</b>`;
}
function txRow(t){const v=txView(t);return`<button class="trow" onclick="openEdit('${t.id}')"><span class="cic" style="--c:${v.col}">${v.icon}</span><span class="tmain"><span class="tt">${esc(v.title)}</span><span class="ts">${esc(v.sub)}</span></span>${amtHtml(t)}</button>`}
function recTitle(r){if(r.type==='inv'||r.type==='res'){const i=invById(r.inv);return r.desc||(i?i.name:'Investimento')}const c=cat(r.type,r.cat);return r.desc||r.sub||(c?c.name:'—')}
function recIcon(r){if(r.type==='inv'||r.type==='res'){const i=invById(r.inv);return{icon:i?kindIcon(i.kind):'💰',col:'var(--acc)'}}const c=cat(r.type,r.cat);return{icon:c?c.icon:'•',col:catColor(c,r.type)}}

function catRow(c,v,total,onclick){
 const col=`var(--s${c.slot})`,lim=c.limit||0;let pct,sub,warn='';
 if(lim){pct=v/lim*100;sub=`de ${money(lim)}`;
  if(v>lim)warn=`<span class="st crit">⚠ ${money(v-lim)} acima do limite</span>`;
  else if(pct>=85)warn=`<span class="st warn">⚠ quase no limite</span>`;
  else sub+=` · resta ${money(lim-v)}`}
 else{pct=total?v/total*100:0;sub=`${Math.round(pct)}% dos gastos`}
 return`<button class="crow" onclick="${onclick}"><span class="cic" style="--c:${col}">${c.icon}</span><span class="cmain"><span class="ctop"><span>${esc(c.name)}</span><b>${money(v)}</b></span><span class="bar"><i style="width:${clamp(pct)}%;background:${v>lim&&lim?'var(--crit)':col}"></i></span><span class="csub">${sub}${warn}</span></span></button>`;
}

/* ================= Telas ================= */
function vHome(){
 const s=summary(cur);let h='';
 if(!data.tx.length&&!data.rec.length)h+=`<section class="card welcome"><img src="welcome.png" class="wimg" alt="Welcome"><h2 style="margin-top:12px">${userName?`Olá, ${esc(userName)}!`:'Olá!'}</h2><div class="mu sm">Comece em 2 passos:</div><ol><li><b>Cadastre o que se repete todo mês</b> (salário, aluguel, internet…). Todo mês elas aparecem aqui para você confirmar com um toque.</li><li><b>Lance os gastos do dia a dia</b> no botão <b>＋</b>. Leva 10 segundos.</li></ol><div class="acts" style="margin-top:0"><button class="btn" onclick="openRecList()">Contas fixas</button><button class="btn pri" onclick="openAdd()">Novo lançamento</button></div></section>`;
 h+=`<section class="card hero"><div class="lbl">${cur===ymOf(todayStr())?'Sobrou até agora':'Sobrou no mês'}</div><div class="big${s.left<0?' neg':''}" ${countAttr('home',s.left)}>${s.left<0?'−':''}${money(Math.abs(s.left))}</div>
 <div class="trio"><button onclick="goExtrato('in')"><span>Entrou</span><b class="pos">${money(s.in)}</b></button><button onclick="goExtrato('out')"><span>Gastou</span><b>${money(s.out)}</b></button><button onclick="go('inv')"><span>Investiu</span><b>${money(s.inv)}</b></button></div>
 ${budgetRow()}
 ${s.in>0&&cur!==ymOf(todayStr())?`<div class="rate"><div class="rtxt">Você guardou <b>${Math.max(0,Math.round(s.rate*100))}%</b> do que entrou</div><div class="bar"><i style="width:${clamp(s.rate*100)}%;background:var(--acc)"></i></div></div>`:''}</section>`;
 const p=pendings(cur),df=dueFats(cur);

function donut(items,total){
 const R=62,C=2*Math.PI*R,gap=items.length>1?2:0;let off=0,segs='';
 for(const it of items){const len=it.v/total*C,dash=Math.max(len-gap,.5);
  segs+=`<circle class="dseg" r="${R}" cx="80" cy="80" fill="none" stroke="${it.col}" stroke-width="20" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" data-tip="${esc(it.name)}|${money(it.v)} · ${Math.round(it.v/total*100)}%"/>`;off+=len}
 return`<svg viewBox="0 0 160 160" class="donut" role="img" aria-label="Gastos por categoria">${segs}<text x="80" y="76" class="dl">Total</text><text x="80" y="96" class="dv">${moneyS(total)}</text></svg>`;

function histChart(){

 const max=Math.max(1,...rows.flatMap(r=>[r.in,r.out]));
 const W=320,H=150,T=14,B=22,ph=H-T-B,gw=W/6,bw=13;
 const bar=(x,v,col,b)=>{const h=v/max*ph;if(h<=0)return'';const y=T+ph-h,r=Math.min(4,h,bw/2);return`<path class="hbar" style="--b:${b}" d="M${x},${T+ph}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${T+ph}Z" fill="${col}"/>`};
 let g=`<line class="grid" x1="0" x2="${W}" y1="${T}" y2="${T}"/><line class="grid" x1="0" x2="${W}" y1="${T+ph/2}" y2="${T+ph/2}"/><text class="axl" x="2" y="${T-4}">${moneyS(max)}</text>`;
 rows.forEach((r,i)=>{const x0=i*gw+gw/2-bw-1;g+=bar(x0,r.in,'var(--s0)',i*2)+bar(x0+bw+2,r.out,'var(--s1)',i*2+1)+`<text class="ax${r.m===cur?' on':''}" x="${i*gw+gw/2}" y="${H-6}">${mShort(r.m)}</text><rect class="hit" x="${i*gw}" y="0" width="${gw}" height="${H}" rx="8" data-tip="${mLabel(r.m)}|Entrou ${money(r.in)}|Gastou ${money(r.out)}" onclick="jumpM('${r.m}')"/>`});
 g+=`<line x1="0" x2="${W}" y1="${T+ph}" y2="${T+ph}" stroke="var(--mu)" stroke-opacity=".5"/>`;
 return`<section class="card"><h3>Últimos 6 meses</h3><div class="lg"><span><i style="background:var(--s0)"></i>Entrou</span><span><i style="background:var(--s1)"></i>Gastou</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Entradas e gastos dos últimos 6 meses">${g}</svg></section>`;
}

// Números grandes "contam" do valor anterior até o novo
const lastNum={};
function runCounters(){
 document.querySelectorAll('[data-ck]').forEach(el=>{
  const k=el.dataset.ck,to=+el.dataset.cv,from=lastNum[k]??0;lastNum[k]=to;
  if(hide||from===to||reduced())return;
  const fmt=v=>(v<-.004?'−':'')+BRL.format(Math.abs(v)),t0=performance.now(),D=750;
  (function step(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)})(t0);
 });
}
const countAttr=(k,v)=>`data-ck="${k}" data-cv="${r2(v)}"`;

   if(cc&&!rec){const f=fatOf(cc,F.date);h+=`<div class="hint">📅 ${F.parc>1?'1ª parcela na':'Entra na'} fatura de <b>${mLabel(f).toLowerCase()}</b> · vence ${fmtD(fatDue(cc,f))}</div>`}

function invChips(optional){
 return`<div class="chips sm">${data.invs.map(i=>`<button class="chip${F.inv===i.id?' on':''}" onclick="fInv('${i.id}',${optional})">${kindIcon(i.kind)} ${esc(i.name)}</button>`).join('')}<button class="chip" onclick="newInvQuick()">＋ Novo</button></div>`;

/* ----- O app aprende com você: pela descrição, repete categoria, pagamento, cartão e conta da última vez ----- */
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pastOf=ft=>data.tx.filter(t=>t.desc&&(t.type==='res'?'inv':t.type)===ft);
function learn(desc,ft){
 const q=norm(desc);if(!q)return null;
 const m=pastOf(ft).filter(t=>norm(t.desc)===q).sort(sortTx);if(!m.length)return null;
 const cnt={};m.slice(0,10).forEach(t=>{const k=JSON.stringify([t.cat,t.sub,t.pay,t.card||'',t.acc||'',t.inv||'',t.type]);cnt[k]=(cnt[k]||0)+1});
 const [c,sub,pay,card,acc,inv,type]=JSON.parse(Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]);
 const sp={};m.forEach(t=>{const k=t.desc.trim();sp[k]=(sp[k]||0)+1});
 const spell=Object.entries(sp).sort((a,b)=>b[1]-a[1])[0][0];// grafia mais usada
 return{desc:spell,cat:c,sub,pay,card,acc,inv,type,amount:m[0].amount};
}
function suggest(q,ft){
 q=norm(q);if(q.length<2)return[];const map={};
 for(const t of pastOf(ft)){const k=norm(t.desc);if(!k.includes(q))continue;const o=map[k]||(map[k]={d:t.desc,n:0,last:''});o.n++;if(t.date>o.last){o.last=t.date;o.d=t.desc}}
 return Object.values(map).filter(o=>norm(o.d)!==q).sort((a,b)=>(b.n-a.n)||b.last.localeCompare(a.last)).slice(0,4).map(o=>o.d);
}
function frequent(ft){
 const lim=addM(ymOf(todayStr()),-4)+'-01',map={};
 for(const t of pastOf(ft)){if(t.date<lim||t.gid)continue;const k=norm(t.desc);const o=map[k]||(map[k]={d:t.desc,n:0,last:'',t});o.n++;if(t.date>=o.last){o.last=t.date;o.d=t.desc;o.t=t}}
 return Object.values(map).filter(o=>o.n>=2).sort((a,b)=>(b.n-a.n)||b.last.localeCompare(a.last)).slice(0,4).map(o=>({...o,d:learn(o.d,ft)?.desc||o.d}));
}
function showSug(v){const el=$('#dsug');if(!el)return;el.innerHTML=suggest(v,F.type).map(d=>`<button class="chip" data-d="${esc(d)}" onpointerdown="event.preventDefault();applyLearn(this.dataset.d,true)">↩ ${esc(d)}</button>`).join('')}
function applyLearn(desc,withAmount){
 setLearn(desc,withAmount);renderForm();
 if(withAmount)setTimeout(()=>{const a=$('#famt');if(a){a.focus();a.select()}},60);
}
function setLearn(desc,withAmount){
 const L=learn(desc,F.type);F.desc=L?L.desc:desc;
 if(L){
  if(F.type==='inv'){F.invDir=L.type==='res'?'res':'inv';if(invById(L.inv))F.inv=L.inv}
  else{if(cat(F.type,L.cat)){F.cat=L.cat;F.sub=L.sub||''}
   if(F.type==='out'){F.pay=L.pay||'';F.card=cardById(L.card)?L.card:'';F.parc=1}
   if(L.inv&&invById(L.inv))F.inv=L.inv}
  if(accById(L.acc))F.acc=L.acc;
  if(withAmount&&!F.amount)F.amount=fmtIn(L.amount);
  F.learned=true;
 }
}
// Ao sair do campo: se a descrição já existe e você ainda não escolheu nada à mão, preenche sozinho.
// Os valores entram na hora; a tela só é redesenhada um instante depois (se você tocou em Salvar, já salva certo).
function autoLearn(){
 if(F.id||F.touched||F.learned||!learn(F.desc,F.type))return;
 setLearn(F.desc,false);const f=F;
 setTimeout(()=>{if(F===f&&sheetOpen&&!f.saved)renderForm()},180);
}

// O dinheiro passa por alguma conta? (rendimento reinvestido não passa)
function needsAcc(){if(F.type==='out')return F.pay!=='credito';if(F.type!=='in')return true;const c=cat('in',F.cat);return!(c&&c.rend&&F.inv&&F.reinv)}
function fType(v){F.type=v;F.cat=catList(v)[0]?.id||'';F.sub='';if(v==='inv'&&!F.inv)F.inv=data.invs[0]?.id||'';if(v==='in')F.inv='';renderForm()}
function fScope(v){F.scope=v;renderForm()}
function fDir(v){F.invDir=v;renderForm()}
function fCat(id){F.touched=true;F.cat=id;F.sub='';const c=cat(F.type,id);F.inv=c&&c.rend?(data.invs[0]?.id||''):'';renderForm()}
function fSub(s){F.touched=true;F.sub=F.sub===s?'':s;renderForm()}
function fPay(p){F.touched=true;F.pay=F.pay===p?'':p;if(F.pay!=='credito')F.parc=1;else if(!cardById(F.card))F.card=(cardById(data.set.lastCard)||data.cards[0])?.id||'';renderForm()}
function fParc(d){F.parc=Math.max(1,Math.min(48,F.parc+d));renderForm()}
function fInv(id,optional){F.inv=optional&&F.inv===id?'':id;renderForm()}
function updParc(){const el=$('#fpv');if(!el)return;const a=parseMoney(F.amount);el.textContent=F.parc>1&&a>0?`${F.parc}x de ${BRL.format(a/F.parc)}`:''}
function newInvQuick(){
 sheet(head('Novo investimento')+`<input class="fld" id="niq" maxlength="40" placeholder="Ex.: CDB, Tesouro Selic, Caixinha" onkeydown="if(event.key==='Enter')saveInvQuick()"><div class="hint">Depois dá para escolher o tipo e a meta na aba Patrimônio.</div><div class="acts"><button class="btn" onclick="renderForm()">Voltar</button><button class="btn pri" onclick="saveInvQuick()">Criar</button></div>`);
 setTimeout(()=>$('#niq')?.focus(),200);
}
function saveInvQuick(){const n=$('#niq').value.trim();if(!n){toast('Dê um nome');return}const i={id:uid(),name:n.slice(0,40),kind:'Outros',goal:0};data.invs.push(i);save();F.inv=i.id;renderForm()}

function saveForm(){
 const amt=r2(parseMoney(F.amount));
 if(!(amt>0)){$('#amtBox').classList.add('err');$('#famt').focus();toast('Digite o valor');return}
 const type=F.type==='inv'?F.invDir:F.type,c=type==='in'||type==='out'?cat(type,F.cat):null;
 if((type==='inv'||type==='res')&&!F.inv){toast('Escolha o investimento');return}
 const base={type,amount:amt,cat:c?F.cat:'',sub:c?F.sub:'',desc:F.desc.trim(),pay:type==='out'?F.pay:'',inv:type==='inv'||type==='res'||(c&&c.rend)?F.inv:'',reinv:!!(c&&c.rend&&F.inv&&F.reinv)};
 base.acc=needsAcc()?(accById(F.acc)?F.acc:defAcc()):'';
 if(base.acc)data.set.lastAcc=base.acc;
 base.card='';
 if(type==='out'&&F.pay==='credito'){if(!cardById(F.card)){toast('Escolha o cartão (ou cadastre um)');return}base.card=F.card;data.set.lastCard=F.card}
 if(F.mode==='rec'){
  const day=Math.min(31,Math.max(1,parseInt(F.day)||1));
  if(F.id)Object.assign(data.rec.find(r=>r.id===F.id),base,{day});
  else data.rec.push({id:uid(),...base,day,start:cur});
  save();render();openRecList();toast('Conta fixa salva');return;
 }
 if(c&&c.veh&&F.sub==='Combustível'){base.km=parseInt(String(F.km).replace(/\D/g,''))||0;base.lt=parseMoney(F.lt)||0}else{base.km=0;base.lt=0}
 let msg='Salvo ✓';F.saved=true;
 if(F.id){
  const t0=data.tx.find(x=>x.id===F.id),sib=t0.gid&&(F.scope||'all')==='all'?data.tx.filter(x=>x.gid===t0.gid):[t0];
  if(sib.length>1){for(const s of sib)Object.assign(s,base);msg=`${sib.length} parcelas atualizadas ✓`}
  else Object.assign(t0,base,{date:F.date});
 }
 else if(type==='out'&&F.pay==='credito'&&F.parc>1){
  const n=F.parc,gid=uid(),each=Math.floor(amt/n*100)/100,ym0=ymOf(F.date),d=+F.date.slice(8);
  for(let i=0;i<n;i++)data.tx.push({id:uid()+i,...base,amount:i===n-1?r2(amt-each*(n-1)):each,date:dateIn(addM(ym0,i),d),gid,parc:`${i+1}/${n}`});
  msg=`${n} parcelas lançadas ✓`;
 }else{
  const t={id:uid(),...base,date:F.date};
  if(F.rid)t.rid=F.rid;
  if(F.repeat){const r={id:uid()+'r',...base,day:+F.date.slice(8),start:ymOf(F.date)};delete r.km;delete r.lt;data.rec.push(r);t.rid=r.id;msg='Salvo e virou conta fixa ✓'}

function openTransfer(id){
 const t=id&&data.tx.find(x=>x.id===id);
 TF=t?{id,amount:fmtIn(t.amount),from:t.acc,to:t.acc2,date:t.date,desc:t.desc||''}:{amount:'',from:data.accs[0]?.id,to:data.accs[1]?.id,date:defDate(),desc:''};
 renderTF();if(!t)setTimeout(()=>$('#tamt')?.focus(),250);
}
function renderTF(){
 const ch=k=>`<div class="chips sm">${data.accs.map(a=>`<button class="chip${TF[k]===a.id?' on':''}" onclick="TF.${k}='${a.id}';renderTF()">${a.icon} ${esc(a.name)}</button>`).join('')}</div>`;
 sheet(head(TF.id?'Editar transferência':'Transferir entre contas')+`<div class="amt"><span>R$</span><input id="tamt" inputmode="decimal" placeholder="0,00" value="${esc(TF.amount)}" oninput="TF.amount=this.value"></div>`+
 lbl('De')+ch('from')+lbl('Para')+ch('to')+lbl('Data')+`<input class="fld" type="date" value="${TF.date}" onchange="if(this.value)TF.date=this.value">`+
 lbl('Descrição <span style="text-transform:none;font-weight:500">(opcional)</span>')+`<input class="fld" maxlength="60" placeholder="Ex.: saque no caixa" value="${esc(TF.desc)}" oninput="TF.desc=this.value">`+
 `<div class="hint">Transferência não conta como gasto nem como entrada: o dinheiro só muda de lugar.</div>`+
 `<div class="acts">${TF.id?`<button class="btn dng" onclick="delTF()">Excluir</button>`:''}<button class="btn pri" onclick="saveTF()">Salvar</button></div>`);
}
function saveTF(){
 const v=r2(parseMoney(TF.amount));if(!(v>0)){toast('Digite o valor');return}
 if(!TF.from||!TF.to||TF.from===TF.to){toast('Escolha contas diferentes');return}
 const vals={type:'tr',amount:v,acc:TF.from,acc2:TF.to,date:TF.date,desc:TF.desc.trim(),cat:'',sub:''};
 if(TF.id)Object.assign(data.tx.find(x=>x.id===TF.id),vals);else data.tx.push({id:uid(),...vals});
 save();closeSheet();render();toast('Transferência salva ✓');
}
function delTF(){const t=data.tx.find(x=>x.id===TF.id);if(!t)return;data.tx=data.tx.filter(x=>x!==t);save();closeSheet();render();toast('Transferência excluída','Desfazer',()=>{data.tx.push(t);save();render()})}

/* ---------- Resumo do ano ---------- */
function openYear(y){
 y=String(y||cur.slice(0,4));
 const rows=Array.from({length:12},(_,i)=>y+'-'+pad(i+1)).map(m=>({m,...summary(m)}));
 const T={in:sum(rows,r=>r.in),out:sum(rows,r=>r.out),inv:sum(rows,r=>r.inv),rend:sum(rows,r=>r.rend)};T.left=r2(T.in-T.out-T.inv);
 const act=rows.filter(r=>r.in||r.out),yTx=data.tx.filter(t=>t.date.startsWith(y));
 let h=head(`📅 Resumo de ${y}`)+`<div style="display:flex;justify-content:space-between;margin:-6px 0 10px"><button class="lnk" onclick="openYear(${+y-1})">‹ ${+y-1}</button><button class="lnk" onclick="openYear(${+y+1})">${+y+1} ›</button></div>`;
 if(!act.length){sheet(h+`<div class="empty"><div class="e">📭</div>Nenhum lançamento em ${y}.</div>`);return}
 const tile=(l,v,cls='')=>`<div><span>${l}</span><b class="${cls}">${v<0?'−':''}${money(Math.abs(v))}</b></div>`;
 h+=`<div class="trio" style="grid-template-columns:1fr 1fr">${tile('Entrou',T.in,'pos')}${tile('Gastou',T.out)}${tile('Investiu',T.inv,'iv')}${tile('Sobrou',T.left,T.left<0?'st crit':'')}</div>`;
 if(T.in>0)h+=`<div class="rate"><div class="rtxt">Você guardou <b>${Math.max(0,Math.round(T.inv/T.in*100))}%</b> do que entrou no ano</div><div class="bar"><i style="width:${clamp(T.inv/T.in*100)}%;background:var(--acc)"></i></div></div>`;
 if(act.length>=2){const s=act.slice().sort((a,b)=>b.left-a.left),best=s[0],worst=s[s.length-1];
  h+=`<div class="stats" style="grid-template-columns:1fr 1fr;margin-top:12px"><div><span>🏆 Melhor mês</span><b>${MESES[+best.m.slice(5)-1]}</b><span>sobrou ${money(best.left)}</span></div><div><span>😬 Mês mais apertado</span><b>${MESES[+worst.m.slice(5)-1]}</b><span>${worst.left<0?'faltou '+money(-worst.left):'sobrou '+money(worst.left)}</span></div></div>`}
 // categorias no ano
 const bc={};for(const t of yTx)if(t.type==='out'){const k=cat('out',t.cat)?t.cat:'_none';bc[k]=(bc[k]||0)+t.amount}
 const cats=data.cats.out.filter(c=>bc[c.id]).sort((a,b)=>bc[b.id]-bc[a.id]);
 if(cats.length)h+=lbl('Gastos por categoria')+cats.map(c=>`<div class="crow"><span class="cic" style="--c:var(--s${c.slot})">${c.icon}</span><span class="cmain"><span class="ctop"><span>${esc(c.name)}</span><b>${money(bc[c.id])}</b></span><span class="bar"><i style="width:${clamp(bc[c.id]/T.out*100)}%;background:var(--s${c.slot})"></i></span><span class="csub">${Math.round(bc[c.id]/T.out*100)}% dos gastos · média ${money(bc[c.id]/act.length)}/mês</span></span></div>`).join('');
 // mês a mês
 h+=lbl('Mês a mês')+`<div class="ytab"><div class="yh"><span>Mês</span><span>Entrou</span><span>Gastou</span><span>Sobrou</span></div>${act.map(r=>`<button class="yr" onclick="closeSheet();tab='home';cur='${r.m}';scrollTo(0,0);render('f')"><span>${mShort(r.m)}</span><span class="pos">${moneyS(r.in)}</span><span>${moneyS(r.out)}</span><b class="${r.left<0?'st crit':''}">${moneyS(r.left)}</b></button>`).join('')}</div><div class="hint">Toque num mês para abrir.</div>`;
 // Imposto de Renda
 const extra=sum(yTx.filter(t=>t.type==='in'&&t.cat==='extra'),t=>t.amount);
 const saude=yTx.filter(t=>t.type==='out'&&norm(t.sub)==='saude');
 const row=(l,v)=>`<div class="sr"><span>${l}</span><b>${money(v)}</b></div>`;
 h+=lbl('Para o Imposto de Renda')+`<div class="subd" style="margin:0">${row('📈 Rendimentos de investimentos',T.rend)}${row('🛠️ Trabalhos por fora',extra)}${row(`🩺 Gastos com saúde (${saude.length})`,sum(saude,t=>t.amount))}</div>
 <div class="hint">São só totais para ajudar a organizar a declaração. Confira as regras da Receita Federal e guarde os comprovantes, principalmente os de saúde.</div>`;
 sheet(h);
}

/* ---------- Backup ---------- */
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
// Backup: no celular abre o "Compartilhar" (WhatsApp, e-mail, Drive…); no computador, baixa o arquivo
async function exportJSON(){
 const name=`financas-backup-${todayStr()}.json`,json=JSON.stringify(data,null,1);
 const done=msg=>{data.set.lastBackup=todayStr();data.set.bkSnooze='';save();render();toast(msg)};
 try{
  const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){
   await navigator.share({files:[file],title:'Backup – Minhas Finanças'});done('Backup enviado ✓');return;
  }
 }catch(e){if(e&&e.name==='AbortError')return}
 download(name,json,'application/json');done('Backup salvo nos downloads ✓');
}
function snoozeBackup(){const d=new Date();d.setDate(d.getDate()+3);data.set.bkSnooze=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());save();render()}
function needBackup(){const lb=data.set.lastBackup;return data.tx.length>=10&&(!lb||(Date.now()-new Date(lb+'T12:00'))/864e5>14)}
// Pede ao navegador para nunca apagar os dados sozinho (ex.: falta de espaço, Safari sem uso)
let persistState='?';
async function protectStorage(){
 try{if(!navigator.storage||!navigator.storage.persist){persistState='no';return}
  persistState=await navigator.storage.persisted()?'ok':(await navigator.storage.persist()?'ok':'ask')}catch(e){persistState='no'}
 if(tab==='mais')render();
}
function importJSON(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 f.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch(e){}
  if(!d||!Array.isArray(d.tx)){toast('Esse arquivo não é um backup deste app');return}
  ask('Restaurar backup?',`O backup tem ${d.tx.length} lançamentos. Os dados atuais serão substituídos.`,'Restaurar',()=>{
   localStorage.setItem(KEY,JSON.stringify(d));data=load();save();closeSheet();render('f');toast('Backup restaurado ✓')})});
}
function exportCSV(){
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
 const tipo={in:'Entrada',out:'Gasto',inv:'Aplicação',res:'Resgate',tr:'Transferência',pf:'Pagamento de fatura'};
 const rows=[['Data','Tipo','Categoria','Subcategoria','Descrição','Pagamento','Parcela','Conta','Para conta','Investimento','Valor']];
 for(const t of data.tx.slice().sort((a,b)=>a.date.localeCompare(b.date))){const c=t.type==='in'||t.type==='out'?cat(t.type,t.cat):null,i=invById(t.inv),a=accById(t.acc)||cardById(t.card),a2=accById(t.acc2);
  rows.push([t.date.split('-').reverse().join('/'),tipo[t.type],c?c.name:'',t.sub||'',t.desc||'',PAY[t.pay]||'',t.parc||'',a?a.name:'',a2?a2.name:'',i?i.name:'',(t.type==='out'||t.type==='inv'?-t.amount:t.amount).toFixed(2).replace('.',',')])}
 download(`financas-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Planilha salva nos downloads');
}
function wipe(){ask('Apagar tudo?','Todos os lançamentos, contas, cartões, contas fixas e investimentos serão apagados. Isso não pode ser desfeito. Faça um backup antes, se quiser.','Apagar tudo',()=>{data=blank();save();closeSheet();render('f');toast('Dados apagados')})}

/* ---------- Toast e tooltip ---------- */
let toastT;
function toast(msg,act,fn){const T=$('#toast');T.innerHTML=esc(msg)+(act?`<button>${act}</button>`:'');if(act)T.querySelector('button').onclick=()=>{fn();T.classList.remove('on')};T.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>T.classList.remove('on'),act?5000:2200)}
const tip=$('#tip');
function tipAt(e){const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.classList.remove('on');return}
 const p=el.dataset.tip.split('|');tip.innerHTML='<b>'+p[0]+'</b>'+p.slice(1).map(s=>'<br>'+s).join('');tip.classList.add('on');
 const w=tip.offsetWidth,h=tip.offsetHeight;let l=e.clientX-w/2,t=e.clientY-h-14;l=Math.max(8,Math.min(innerWidth-w-8,l));if(t<8)t=e.clientY+18;tip.style.left=l+'px';tip.style.top=t+'px'}
document.addEventListener('pointermove',tipAt);document.addEventListener('pointerdown',tipAt);
addEventListener('scroll',()=>tip.classList.remove('on'),{passive:true});

/* ---------- Nome (perguntado uma única vez, antes de entrar) ---------- */
let userName=localStorage.getItem('fin-nome')||'';
function showGate(){
 const g=$('#gate');
 g.innerHTML=`<div class="box"><img src="welcome.png" class="wimg" alt="Welcome"><h1>Como você se chama?</h1><div class="mu sm">É só uma vez, para te dar as boas-vindas.</div><input class="fld" id="gname" maxlength="30" autocomplete="given-name" placeholder="Seu nome" onkeydown="if(event.key==='Enter')enterGate()"><button class="btn pri full" style="margin-top:12px" onclick="enterGate()">Entrar</button></div>`;
 g.hidden=false;setTimeout(()=>$('#gname')?.focus(),150);
}
function enterGate(){const n=$('#gname').value.trim().replace(/\s+/g,' ');if(!n){$('#gname').focus();toast('Digite seu nome');return}userName=n.slice(0,30);localStorage.setItem('fin-nome',userName);
 const g=$('#gate');g.classList.add('leave');render('f');setTimeout(()=>{g.hidden=true;g.classList.remove('leave')},reduced()?0:450)}
function changeName(){
 sheet(head('Seu nome')+`<input class="fld" id="cn" maxlength="30" value="${esc(userName)}" placeholder="Seu nome" onkeydown="if(event.key==='Enter')saveName()"><div class="acts"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn pri" onclick="saveName()">Salvar</button></div>`);
 setTimeout(()=>$('#cn')?.focus(),200);
}
function saveName(){const n=$('#cn').value.trim().replace(/\s+/g,' ');if(!n){toast('Digite seu nome');return}userName=n.slice(0,30);localStorage.setItem('fin-nome',userName);closeSheet();render();toast('Nome atualizado')}

$('#fab').innerHTML=I.plus;
render('f');
protectStorage();
if(!userName)showGate();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
